<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Terabox Video Player (Streaming Proxy)</title>
    <style>
        body { background: #222; color: #fff; text-align: center; }
        input { width: 60vw; padding: 10px; }
        button { padding: 10px 20px; }
        video { width: 80vw; height: 60vh; margin-top: 30px; }
        pre { background: #333; color: #0f0; text-align: left; margin: 20px auto; width: 80vw; padding: 20px; }
    </style>
</head>
<body>
    <h1>Terabox Video Player (Streaming Proxy)</h1>
    <input type="text" id="videoUrl" placeholder="Paste Terabox share link here">
    <button onclick="playVideo()">Play</button>
    <br>
    <video id="player" controls></video>
    <pre id="output"></pre>
    <script>
        async function playVideo() {
            const shareUrl = document.getElementById('videoUrl').value;
            const output = document.getElementById('output');
            const player = document.getElementById('player');
            output.textContent = "Loading...";
            player.src = "";
            try {
                // Apne Cloudflare Worker/proxy ka URL yahan lagayein
                const workerBase = 'https://terabypassprince.py981962.workers.dev';
                const res = await fetch(workerBase + '/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mode: "3",
                        url: shareUrl
                    })
                });
                const data = await res.json();
                output.textContent = JSON.stringify(data, null, 2);
                if (data.status === "success" && data.download_link) {
                    if (data.download_link.url_1) {
                        // Try direct link first
                        player.src = data.download_link.url_1;
                        player.load();
                        player.play();
                    } else if (data.download_link.url_2) {
                        // Use streaming proxy for url_2
                        const encoded = encodeURIComponent(data.download_link.url_2);
                        player.src = `${workerBase}/stream?url=${encoded}`;
                        player.load();
                        player.play();
                    } else {
                        output.textContent += "\nDirect link nahi mila!";
                    }
                } else {
                    output.textContent += "\nDirect link nahi mila!";
                }
            } catch (e) {
                output.textContent = "Error: " + e;
            }
        }
    </script>
</body>
</html>
