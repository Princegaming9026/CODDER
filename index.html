<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brightcove Video Player</title>
</head>
<body>
    <h1>Brightcove Video Player</h1>

    <!-- Video Embed Section -->
    <div id="video-container"></div>

    <script>
        // API URL for the video
        const apiUrl = "https://edge.api.brightcove.com/playback/v1/accounts/6206459123001/videos/6368750600112";

        // Fetch the video data from the Brightcove API
        fetch(apiUrl, {
            method: 'GET',
            headers: {
                'BCOV-POLICY': 'BCpkADawqM1VmXspFMod94-pT7xDCvmBEYt8U7f0mRB6XnG5huPE7I9qjhDW0qpx3LRyTD9WX7W6JvUGtgKN-qf1pJoZO-QXBMIykDivtAOgkJOmN-kyv4m_F0thrJ45z95hqWON0nsKBwvd'
            }
        })
        .then(response => response.json())
        .then(data => {
            console.log(data); // Check the data to see the structure

            // Assuming the API response contains a video URL at 'data.sources[0].src'
            const videoUrl = data.sources[0].src; // Modify this based on actual API response

            // Check if videoUrl is valid
            if (videoUrl) {
                // Create a video element and set its source
                const videoContainer = document.getElementById('video-container');
                const videoElement = document.createElement('video');
                videoElement.controls = true;
                videoElement.src = videoUrl;

                // Append the video element to the container
                videoContainer.appendChild(videoElement);
            } else {
                console.error("Video URL not found in API response.");
            }
        })
        .catch(error => {
            console.error("Error fetching video data: ", error);
        });
    </script>
</body>
</html>
