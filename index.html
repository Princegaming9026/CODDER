<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DASH Video Playback</title>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
  <style>
    body {
      background-color: black;
      color: white;
      text-align: center;
    }
    video {
      width: 80%;
      max-width: 1200px;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>DASH Video Playback</h1>
  <video id="videoPlayer" controls></video>

  <script>
    // Replace with the actual DASH Manifest URL (if available)
    var manifestUrl = 'http://house-fastly-signed-ap-southeast-1-prod.brightcovecdn.com/media/v1/dash/live/cenc/6206459123001/b0f6c1e4-c87e-4b0b-b380-534d5c59ee95/494aed01-62cd-4ae3-9800-d47ba82d2e86/11702b6c-7f7b-4da9-919e-830118061ab0/3x/manifest.mpd'; 

    // Initialize the dash.js player
    var player = dashjs.MediaPlayer().create();
    player.initialize(document.querySelector("#videoPlayer"), manifestUrl, true);
  </script>
</body>
</html>
